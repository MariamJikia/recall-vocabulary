<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recall</title><style>
:root{--p:#5b5bd6;--bg:#f7f8fc;--line:#e4e7ef;--muted:#747b88;--ok:#16834a;--bad:#b33}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui;color:#202331}.app{max-width:1000px;margin:auto;padding:28px 18px 60px}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.top{margin-bottom:28px}.logo{font-size:30px;font-weight:850;cursor:pointer}.logo span,.mode{color:var(--p)}.muted,.small{color:var(--muted)}.small{font-size:12px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #2221}.create{text-align:center;border:2px dashed #cfd3df;padding:48px 20px;cursor:pointer}.plus{font-size:44px;color:var(--p)}button{border:0;border-radius:12px;padding:11px 15px;font-weight:750;cursor:pointer}.primary{background:var(--p);color:white}.ghost{background:white;border:1px solid var(--line)}input,select{width:100%;padding:12px;border:1px solid #d9dce6;border-radius:12px;font:inherit}.groups{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.toolbar{display:grid;grid-template-columns:1fr 150px;gap:10px;margin:14px 0}.library{border:1px solid var(--line);border-radius:15px;padding:0 13px}.wordrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:13px 0;border-bottom:1px solid #eee}.wordcheck{width:20px;height:20px}.level{font-size:11px;font-weight:800;background:#efefff;color:#4848a8;padding:5px 8px;border-radius:99px}.pager,.center{display:flex;justify-content:center;align-items:center;gap:10px;margin:14px 0}.learn,.test{max-width:680px;margin:25px auto}.flash{min-height:330px;display:grid;place-items:center;text-align:center;cursor:pointer}.flashWord{font-size:42px;font-weight:850}.ipa{font-size:18px;color:var(--muted)}.meaning{font-size:22px;line-height:1.5}.example{font-size:17px;color:#606775;margin-top:18px}.mode{font-size:12px;font-weight:850;text-transform:uppercase}.prompt{font-size:23px;line-height:1.5;margin:28px 0}.feedback{padding:13px;border-radius:12px;margin-top:14px}.correct{background:#edf8f1;color:var(--ok)}.wrong{background:#fff0f0;color:var(--bad)}@media(max-width:720px){.groups,.toolbar{grid-template-columns:1fr}}
</style></head><body><div class="app"><div class="top"><div class="logo" id="logo">Re<span>call</span></div><div class="muted">Vocabulary memory trainer</div></div><main id="main"></main></div><script>
const WORDS='https://raw.githubusercontent.com/nalgeon/words/main/data/oxford-5k.csv',DICT='https://api.dictionaryapi.dev/api/v2/entries/en/';
let groups=[],vocab=[],cache={},gi=null,li=0,flip=false,qs=[],qi=0,right=0;try{groups=JSON.parse(localStorage.getItem('recall_groups')||'[]')}catch{}try{cache=JSON.parse(localStorage.getItem('recall_details')||'{}')}catch{}const main=document.getElementById('main');
const esc=s=>String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const norm=s=>String(s||'').trim().toLowerCase();function save(){localStorage.setItem('recall_groups',JSON.stringify(groups));localStorage.setItem('recall_details',JSON.stringify(cache))}function speech(w){if(!speechSynthesis)return;let u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}function say(w,a,e){if(e)e.stopPropagation();if(a)new Audio(a).play().catch(()=>speech(w));else speech(w)}
function home(){gi=null;if(!groups.length){main.innerHTML='<div class="card create" id="newGroup"><div class="plus">＋</div><h1>Create New Group</h1><p class="muted">Choose words for your first group.</p></div>';newGroup.onclick=create;return}let h='<h1>Your groups</h1><div class="groups">';groups.forEach((g,i)=>h+=`<div class="card group" data-i="${i}"><h2>${esc(g.name)}</h2><p class="muted">${g.words.length} words</p></div>`);h+='<div class="card create" id="newGroup"><div class="plus">＋</div><h2>Create New Group</h2></div></div>';main.innerHTML=h;newGroup.onclick=create;document.querySelectorAll('.group').forEach(x=>x.onclick=()=>group(+x.dataset.i))}
function load(done){if(vocab.length)return done();fetch(WORDS).then(r=>r.text()).then(t=>{let seen=new Set();vocab=t.split(/\r?\n/).slice(1).map(x=>x.split(',')).filter(c=>c.length>4&&['b2','c1'].includes((c[1]||'').toLowerCase())).map(c=>({word:c[0].trim(),level:c[1].trim().toUpperCase(),pos:c[2].trim(),audio:(c[4]||'').trim()})).filter(x=>x.word&&!seen.has(norm(x.word))&&(seen.add(norm(x.word)),1));done()}).catch(()=>{alert('Could not load vocabulary. Please try again.');home()})}
function create(){main.innerHTML='<div class="row"><h1>Create New Group</h1><button class="ghost" id="back">← Home</button></div><div class="card"><label>Group name</label><input id="name" placeholder="Example: September Week 1"><div id="state" class="muted" style="margin:14px 0">Loading vocabulary…</div><div id="picker" style="display:none"><div class="toolbar"><input id="search" placeholder="Search all available words…"><select id="lev"><option>ALL</option><option>B2</option><option>C1</option></select></div><b id="count">0 selected</b><div class="library" id="lib"></div><div class="pager"><button class="ghost" id="prev">← Previous</button><span id="page" class="small"></span><button class="ghost" id="next">Next →</button></div><button class="primary" id="saveG">Create Group</button></div></div>';back.onclick=home;load(setupPicker)}
function setupPicker(){let used=new Set(groups.flatMap(g=>g.words.map(x=>norm(x.word)))),avail=vocab.filter(x=>!used.has(norm(x.word))),sel=new Set(),p=0,ps=30;state.innerHTML='<b>'+avail.length.toLocaleString()+' unused B2–C1 words available.</b>';picker.style.display='block';function filtered(){let q=norm(search.value),l=lev.value;return avail.filter(x=>(!q||norm(x.word).includes(q))&&(l==='ALL'||x.level===l))}function draw(){let a=filtered(),pages=Math.max(1,Math.ceil(a.length/ps));p=Math.max(0,Math.min(p,pages-1));let items=a.slice(p*ps,(p+1)*ps);lib.innerHTML=items.map(x=>`<label class="wordrow"><input class="wordcheck" type="checkbox" data-w="${esc(x.word)}" ${sel.has(x.word)?'checked':''}><div><b>${esc(x.word)}</b> <button class="ghost speak" data-w="${esc(x.word)}" data-a="${esc(x.audio)}">🔊</button><div class="small">${esc(x.pos)}</div></div><span class="level">${x.level}</span></label>`).join('')||'<p class="muted">No matching words.</p>';page.textContent=`Page ${p+1} of ${pages} · ${a.length} words`;document.querySelectorAll('.wordcheck').forEach(c=>c.onchange=()=>{c.checked?sel.add(c.dataset.w):sel.delete(c.dataset.w);count.textContent=sel.size+' selected'});document.querySelectorAll('.speak').forEach(b=>b.onclick=e=>say(b.dataset.w,b.dataset.a,e))}search.oninput=()=>{p=0;draw()};lev.onchange=()=>{p=0;draw()};prev.onclick=()=>{p--;draw()};next.onclick=()=>{p++;draw()};draw();saveG.onclick=()=>{let n=name.value.trim();if(!n||!sel.size)return alert('Please name the group and choose at least one word.');groups.push({name:n,words:[...sel].map(w=>{let v=avail.find(x=>x.word===w);return{word:w,status:'active',score:0,level:v.level,pos:v.pos,audio:v.audio}})});save();home()}}
function detail(item,done){if(cache[item.word])return done(cache[item.word]);fetch(DICT+encodeURIComponent(item.word)).then(r=>r.json()).then(d=>{let e=d[0]||{},m=(e.meanings||[]).find(x=>!item.pos||x.partOfSpeech===item.pos)||(e.meanings||[])[0]||{},z=(m.definitions||[])[0]||{},o={phonetic:e.phonetic||'',definition:z.definition||'Definition unavailable.',example:z.example||'',audio:item.audio||''};cache[item.word]=o;save();done(o)}).catch(()=>done({phonetic:'',definition:'Definition unavailable.',example:'',audio:item.audio||''}))}
function group(i){gi=i;let g=groups[i],h=`<div class="row"><div><h1>${esc(g.name)}</h1><p class="muted">${g.words.length} words</p></div><button class="ghost" id="back">← Groups</button></div><div class="card"><button class="primary" id="learnB">Learn words</button> <button class="primary" id="testB">Test my knowledge</button><p class="muted">Tests: Description → type · Sentence → missing word · Listen → type · Description → pronounce</p></div>`;g.words.forEach(x=>h+=`<div class="card"><b>${esc(x.word)}</b> <span class="small">${esc(x.level)} ${esc(x.pos)}</span> <button class="ghost speak" data-w="${esc(x.word)}" data-a="${esc(x.audio)}">🔊</button></div>`);main.innerHTML=h;back.onclick=home;learnB.onclick=learn;testB.onclick=startTest;document.querySelectorAll('.speak').forEach(b=>b.onclick=e=>say(b.dataset.w,b.dataset.a,e))}
function learn(){li=0;flip=false;renderLearn()}function renderLearn(){let a=groups[gi].words.filter(x=>x.status!=='mastered');if(!a.length)return group(gi);li=(li+a.length)%a.length;let it=a[li];main.innerHTML=`<div class="learn"><div class="row"><h2>Learn words</h2><button class="ghost" id="back">← Group</button></div><div class="card flash" id="card"><span class="muted">Loading…</span></div><div class="center"><button class="ghost" id="prev">← Previous</button><span>${li+1} of ${a.length}</span><button class="primary" id="next">Next →</button></div></div>`;back.onclick=()=>group(gi);prev.onclick=()=>{li--;flip=false;renderLearn()};next.onclick=()=>{li++;flip=false;renderLearn()};detail(it,d=>{card.innerHTML=!flip?`<div><div><span class="flashWord">${esc(it.word)}</span> <button class="ghost" id="hear">🔊</button></div><div class="ipa">${esc(d.phonetic)}</div><p class="muted">Tap card to flip</p></div>`:`<div><div class="meaning">${esc(d.definition)}</div><div class="example">${esc(d.example||'No example sentence available yet.')}</div></div>`;card.onclick=()=>{flip=!flip;renderLearn()};if(!flip)hear.onclick=e=>say(it.word,it.audio||d.audio,e)})}
function gap(it,d){let s=d.example||'',i=norm(s).indexOf(norm(it.word));if(i<0){let p=norm(it.pos);s=p.includes('verb')?'They decided to '+it.word+' the issue before the meeting.':p.includes('adj')?'The result seemed '+it.word+' to everyone.':p.includes('adv')?'She responded '+it.word+' during the discussion.':'The report discussed '+it.word+' in detail.';i=norm(s).indexOf(norm(it.word))}return s.slice(0,i)+'__________'+s.slice(i+it.word.length)}
function startTest(){let a=groups[gi].words.filter(x=>x.status!=='mastered');if(!a.length)return alert('No Active words to test.');qs=[];a.forEach(item=>['definition','gap','listen','speak'].forEach(type=>qs.push({item,type})));qs.sort(()=>Math.random()-.5);qi=right=0;renderTest()}
function renderTest(){if(qi>=qs.length)return finish();let q=qs[qi],it=q.item,mode={definition:'Description → type the word',gap:'Sentence → type the missing word',listen:'Listen → type the word',speak:'Description → pronounce the word'}[q.type];main.innerHTML=`<div class="test"><div class="row"><div><div class="mode">${mode}</div><div class="muted">${qi+1} of ${qs.length}</div></div><button class="ghost" id="end">End test</button></div><div class="card"><div id="prompt" class="prompt"><span class="muted">Loading…</span></div><div id="controls"></div></div></div>`;end.onclick=()=>group(gi);detail(it,d=>{if(q.type==='gap')prompt.textContent=gap(it,d);else if(q.type==='listen'){prompt.innerHTML='<button class="primary" id="play">🔊 Play word</button>';play.onclick=e=>say(it.word,it.audio||d.audio,e);setTimeout(()=>say(it.word,it.audio||d.audio),250)}else prompt.textContent=d.definition;controls.innerHTML=q.type==='speak'?'<div class="center"><button class="primary" id="mic">🎤 Speak</button><button class="ghost" id="dk">I don\'t know</button></div><p class="small" style="text-align:center">Speak naturally. A clear foreign accent is okay.</p><div id="status" class="small" style="text-align:center"></div><div id="fb"></div>':'<input id="ans" autocomplete="off" autocapitalize="off" placeholder="Type the word"><p class="small">Press ENTER to check · Capital letters are forgiven.</p><div class="row"><button class="ghost" id="dk">I don\'t know</button><button class="primary" id="check">Check</button></div><div id="fb"></div>';dk.onclick=()=>answer(false);if(q.type==='speak')mic.onclick=pronounce;else{check.onclick=()=>answer();ans.onkeydown=e=>{if(e.key==='Enter')answer()}}})}
const nsp=s=>String(s||'').toLowerCase().replace(/[^a-z]/g,'');function dist(a,b){let d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}function match(t,h){t=nsp(t);h=nsp(h);if(!t||!h)return false;if(t===h||h.includes(t)||t.includes(h))return true;let e=t.length<=5?1:Math.max(1,Math.floor(t.length*.22));return dist(t,h)<=e}
function pronounce(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){status.textContent='Speech recognition is not supported here. Try Chrome or Edge.';return}let it=qs[qi].item,r=new SR();r.lang='en-US';r.maxAlternatives=10;r.interimResults=false;mic.disabled=true;status.textContent='Listening…';r.onresult=e=>{let heard=[],ok=false;for(let i=0;i<e.results[0].length;i++){let t=e.results[0][i].transcript;heard.push(t);if(match(it.word,t))ok=true}status.textContent='I heard: '+heard[0];answer(ok?'speech':false)};r.onerror=e=>{mic.disabled=false;status.textContent=e.error==='not-allowed'?'Microphone permission is needed.':'I could not understand that. Try again.'};r.onend=()=>{if(document.getElementById('mic')&&!fb.innerHTML)mic.disabled=false};r.start()}
function answer(force){let it=qs[qi].item,input=document.getElementById('ans'),ok=force==='speech'?true:force===false?false:input&&norm(input.value)===norm(it.word);if(document.getElementById('check'))check.disabled=true;if(document.getElementById('dk'))dk.disabled=true;if(document.getElementById('mic'))mic.disabled=true;if(ok){right++;if(input)input.disabled=true;fb.innerHTML='<div class="feedback correct">✓ Correct</div><div style="text-align:right;margin-top:12px"><button class="primary" id="nxt">Next →</button></div>';nxt.onclick=nextQ}else practice(it)}function practice(it){let input=document.getElementById('ans');if(!input){input=document.createElement('input');input.id='ans';input.placeholder='Type the correct word';fb.parentNode.insertBefore(input,fb)}input.value='';input.disabled=false;input.focus();fb.innerHTML=`<div class="feedback wrong">✕ Answer: <b>${esc(it.word)}</b><div class="small" style="margin-top:7px">This stays wrong. Type the correct word once — no point will be added.</div></div><div id="msg"></div><div style="text-align:right;margin-top:12px"><button class="primary" id="confirm">Confirm typing</button></div>`;let f=()=>{if(norm(input.value)!==norm(it.word)){msg.innerHTML='<div class="small" style="color:var(--bad);margin-top:10px">Type the correct word exactly as shown above.</div>';input.select();return}input.disabled=true;confirm.disabled=true;msg.innerHTML=`<div class="feedback correct">✓ Good — you typed <b>${esc(it.word)}</b>. No point was added.</div><div style="text-align:right;margin-top:12px"><button class="primary" id="nxt">Next →</button></div>`;nxt.onclick=nextQ};confirm.onclick=f;input.onkeydown=e=>{if(e.key==='Enter')f()}}function nextQ(){qi++;renderTest()}function finish(){main.innerHTML=`<div class="test"><div class="card" style="text-align:center"><h1>Test complete</h1><p>You got <b>${right} of ${qs.length}</b> correct.</p><p class="muted">Wrong first attempts stay wrong even after practice typing.</p><button class="primary" id="back">Back to group</button></div></div>`;back.onclick=()=>group(gi)}
logo.onclick=home;home();
</script></body></html>
