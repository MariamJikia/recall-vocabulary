<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recall</title>
<style>
:root{--p:#5b5bd6;--bg:#f7f8fc;--line:#e4e7ef;--muted:#737987}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#202331}.app{max-width:950px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}.logo{font-size:30px;font-weight:850}.logo span{color:var(--p)}.muted{color:var(--muted)}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #2221}.create{border:2px dashed #cfd3df;text-align:center;padding:55px 20px}.plus{font-size:45px;color:var(--p)}button{border:0;border-radius:12px;padding:11px 15px;font-weight:750;cursor:pointer}.primary{background:var(--p);color:white}.ghost{background:white;border:1px solid var(--line)}input{width:100%;padding:12px;border:1px solid #d9dce6;border-radius:12px;font:inherit;margin:8px 0 14px}.word{display:block;padding:12px 0;border-bottom:1px solid #eee}.word input{width:auto;margin-right:8px}.group{cursor:pointer}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="logo">Re<span>call</span></div><div class="muted">Vocabulary memory trainer</div></div>
  <main id="main">
    <div class="card create">
      <div class="plus">＋</div>
      <h1>Create New Group</h1>
      <p class="muted">Choose words for your first group.</p>
      <button class="primary" id="createBtn">Create New Group</button>
    </div>
  </main>
</div>
<script>
const LIB = [
  ['reluctant','/rɪˈlʌktənt/','Not willing or eager to do something; hesitant.'],
  ['acknowledge','/əkˈnɑːlɪdʒ/','To accept, admit, or recognize that something is true or exists.'],
  ['subtle','/ˈsʌtəl/','Not obvious or easy to notice.'],
  ['inevitable','/ɪnˈevɪtəbəl/','Certain to happen and impossible to avoid.'],
  ['convey','/kənˈveɪ/','To communicate or express an idea, feeling, or message.'],
  ['ambiguous','/æmˈbɪɡjuəs/','Having more than one possible meaning; unclear.'],
  ['coherent','/koʊˈhɪrənt/','Logical, clear, and consistent.'],
  ['deteriorate','/dɪˈtɪriəreɪt/','To become progressively worse.'],
  ['elaborate','/ɪˈlæbərət/','Detailed and complicated in design or planning.'],
  ['feasible','/ˈfiːzəbəl/','Possible and practical to do successfully.'],
  ['inherent','/ɪnˈhɪrənt/','Existing as a natural or basic part of something.'],
  ['scrutinize','/ˈskruːtənaɪz/','To examine something very carefully.']
];

const main = document.getElementById('main');
let groups = [];
try { groups = JSON.parse(localStorage.getItem('recall_groups') || '[]'); }
catch (e) { groups = []; }

function save(){ localStorage.setItem('recall_groups', JSON.stringify(groups)); }
function renderHome(){
  if(!groups.length){
    main.innerHTML = '<div class="card create"><div class="plus">＋</div><h1>Create New Group</h1><p class="muted">Choose words for your first group.</p><button class="primary" id="createBtn">Create New Group</button></div>';
    document.getElementById('createBtn').addEventListener('click', renderCreate);
    return;
  }
  let html = '<h1>Your groups</h1><p class="muted">Choose a group or create a new one.</p>';
  groups.forEach(function(g, i){ html += '<div class="card group" data-i="'+i+'"><h2>'+g.name+'</h2><p>'+g.words.length+' words</p></div>'; });
  html += '<div class="card create"><div class="plus">＋</div><h2>Create New Group</h2><button class="primary" id="createBtn">Create New Group</button></div>';
  main.innerHTML = html;
  document.getElementById('createBtn').addEventListener('click', renderCreate);
  document.querySelectorAll('.group').forEach(function(el){ el.addEventListener('click', function(){ renderGroup(Number(el.dataset.i)); }); });
}

function renderCreate(){
  let html = '<div class="row"><h1>Create New Group</h1><button class="ghost" id="homeBtn">← Home</button></div><div class="card"><label>Group name</label><input id="groupName" placeholder="September Week 1"><h3>＋ Choose words</h3>';
  LIB.forEach(function(w, i){ html += '<label class="word"><input type="checkbox" value="'+i+'"><b>'+w[0]+'</b> '+w[1]+'<br><span class="muted">'+w[2]+'</span></label>'; });
  html += '<button class="primary" id="saveGroup">Create Group</button></div>';
  main.innerHTML = html;
  document.getElementById('homeBtn').addEventListener('click', renderHome);
  document.getElementById('saveGroup').addEventListener('click', function(){
    const name = document.getElementById('groupName').value.trim();
    const chosen = Array.from(document.querySelectorAll('.word input:checked')).map(function(x){ return LIB[Number(x.value)][0]; });
    if(!name || !chosen.length){ alert('Please name the group and choose at least one word.'); return; }
    groups.push({name:name, words:chosen.map(function(w){return {word:w,status:'active',score:0};})});
    save(); renderHome();
  });
}

function renderGroup(i){
  const g = groups[i];
  let html = '<div class="row"><div><h1>'+g.name+'</h1><p class="muted">'+g.words.length+' words</p></div><button class="ghost" id="homeBtn">← Groups</button></div><div class="card"><button class="primary" disabled>Learn words</button> <button class="primary" disabled>Test my knowledge</button><p class="muted">The group flow is working. The full learn/test engine will be restored next.</p></div>';
  g.words.forEach(function(item){ const w=LIB.find(function(x){return x[0]===item.word;}); html += '<div class="card"><b>'+item.word+'</b> '+(w?w[1]:'')+'<p class="muted">'+(w?w[2]:'')+'</p></div>'; });
  main.innerHTML = html;
  document.getElementById('homeBtn').addEventListener('click', renderHome);
}

document.getElementById('createBtn').addEventListener('click', renderCreate);
if(groups.length) renderHome();
</script>
</body>
</html>
