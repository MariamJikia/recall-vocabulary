<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recall</title>
<style>
:root{--p:#5b5bd6;--bg:#f7f8fc;--line:#e4e7ef;--muted:#737987;--soft:#efefff;--ok:#16834a;--bad:#b33}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#202331}.app{max-width:1000px;margin:auto;padding:28px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.logo{font-size:30px;font-weight:850;cursor:pointer}.logo span{color:var(--p)}.muted{color:var(--muted)}.small{font-size:12px;color:var(--muted)}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #2221}.create{border:2px dashed #cfd3df;text-align:center;padding:48px 20px;cursor:pointer}.plus{font-size:45px;color:var(--p)}button{border:0;border-radius:12px;padding:11px 15px;font-weight:750;cursor:pointer;font:inherit}.primary{background:var(--p);color:white}.ghost{background:white;border:1px solid var(--line)}input,select{width:100%;padding:12px;border:1px solid #d9dce6;border-radius:12px;font:inherit}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.groups{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.group{cursor:pointer}.toolbar{display:grid;grid-template-columns:1fr 150px;gap:10px;margin:14px 0}.library{border:1px solid var(--line);border-radius:15px;padding:0 13px;min-height:110px}.wordrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:13px 0;border-bottom:1px solid #eee}.wordcheck{width:20px;height:20px;margin-top:4px}.level{font-size:11px;font-weight:800;padding:5px 8px;background:var(--soft);color:#4848a8;border-radius:999px}.pager{display:flex;justify-content:center;gap:10px;align-items:center;margin:14px 0}.speakBtn{font-size:18px;padding:6px 8px}.learnWrap,.testWrap{max-width:680px;margin:25px auto}.flash{min-height:330px;text-align:center;display:flex;align-items:center;justify-content:center;cursor:pointer}.flashWord{font-size:42px;font-weight:850}.ipa{font-size:18px;color:var(--muted);margin-top:8px}.counter{text-align:center;color:var(--muted);margin:12px 0}.center{justify-content:center}.meaning{font-size:22px;line-height:1.5}.example{font-size:17px;color:#5f6570;margin-top:18px}.notice{padding:12px;border-radius:12px;background:#f5f5ff;color:#4b4b8d;margin:10px 0}.details{margin-top:6px;color:#626976;font-size:13px}.selectedCount{font-weight:800;color:var(--p)}.mode{font-size:12px;color:var(--p);font-weight:850;text-transform:uppercase;letter-spacing:.04em}.testPrompt{font-size:23px;line-height:1.5;margin:28px 0}.feedback{padding:13px;border-radius:12px;margin-top:14px}.correct{background:#edf8f1;color:var(--ok)}.wrong{background:#fff0f0;color:var(--bad)}
@media(max-width:720px){.groups{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.wordrow{grid-template-columns:auto 1fr}.level{grid-column:2}}
</style></head><body><div class="app"><div class="top"><div class="logo" id="logo">Re<span>call</span></div><div class="muted">Vocabulary memory trainer</div></div><main id="main"></main></div>
<script>
const WORDS_URL='https://raw.githubusercontent.com/nalgeon/words/main/data/oxford-5k.csv',DICT_URL='https://api.dictionaryapi.dev/api/v2/entries/en/';
const SAMPLE=[{word:'reluctant',level:'B2',pos:'adjective',audio:'',phonetic:'/rɪˈlʌktənt/',definition:'Not willing or eager to do something; hesitant.',example:'She was reluctant to discuss what happened.'},{word:'acknowledge',level:'B2',pos:'verb',audio:'',phonetic:'/əkˈnɑːlɪdʒ/',definition:'To accept, admit, or recognize that something is true or exists.',example:'He acknowledged that the project took longer than expected.'},{word:'subtle',level:'B2',pos:'adjective',audio:'',phonetic:'/ˈsʌtəl/',definition:'Not obvious or easy to notice.',example:'There was a subtle change in her tone.'},{word:'inevitable',level:'B2',pos:'adjective',audio:'',phonetic:'/ɪnˈevɪtəbəl/',definition:'Certain to happen and impossible to avoid.',example:'Some delays were inevitable.'},{word:'convey',level:'B2',pos:'verb',audio:'',phonetic:'/kənˈveɪ/',definition:'To communicate or express an idea, feeling, or message.',example:'Her expression conveyed disappointment.'},{word:'ambiguous',level:'C1',pos:'adjective',audio:'',phonetic:'/æmˈbɪɡjuəs/',definition:'Having more than one possible meaning; unclear.',example:'The instructions were deliberately ambiguous.'},{word:'coherent',level:'C1',pos:'adjective',audio:'',phonetic:'/koʊˈhɪrənt/',definition:'Logical, clear, and consistent.',example:'She gave a coherent explanation.'},{word:'deteriorate',level:'C1',pos:'verb',audio:'',phonetic:'/dɪˈtɪriəreɪt/',definition:'To become progressively worse.',example:'The weather began to deteriorate.'}];
const main=document.getElementById('main');let groups=[],vocabulary=[],detailsCache={},currentGroupIndex=null,learnIndex=0,learnFlipped=false,testItems=[],testIndex=0,testCorrect=0;
try{groups=JSON.parse(localStorage.getItem('recall_groups')||'[]')}catch(e){}try{detailsCache=JSON.parse(localStorage.getItem('recall_details')||'{}')}catch(e){}
function save(){localStorage.setItem('recall_groups',JSON.stringify(groups));localStorage.setItem('recall_details',JSON.stringify(detailsCache))}
function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function usedWords(){const s=new Set();groups.forEach(g=>g.words.forEach(x=>s.add(x.word.toLowerCase())));return s}
function speech(word){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}
function speakWord(word,audio,e){if(e)e.stopPropagation();if(audio){new Audio(audio).play().catch(()=>speech(word))}else speech(word)}
function renderHome(){currentGroupIndex=null;if(!groups.length){main.innerHTML='<div class="card create" id="newGroup"><div class="plus">＋</div><h1>Create New Group</h1><p class="muted">Choose words for your first group.</p></div>';newGroup.onclick=renderCreate;return}let h='<h1>Your groups</h1><p class="muted">Choose a group or create a new one.</p><div class="groups">';groups.forEach((g,i)=>h+='<div class="card group" data-i="'+i+'"><h2>'+esc(g.name)+'</h2><p class="muted">'+g.words.length+' words</p></div>');h+='<div class="card create" id="newGroup"><div class="plus">＋</div><h2>Create New Group</h2></div></div>';main.innerHTML=h;newGroup.onclick=renderCreate;document.querySelectorAll('.group').forEach(el=>el.onclick=()=>renderGroup(Number(el.dataset.i)))}
function parseCSV(text){const lines=text.split(/\r?\n/),out=[],seen=new Set();for(let i=1;i<lines.length;i++){const c=lines[i].split(',');if(c.length<5)continue;const word=(c[0]||'').trim(),level=(c[1]||'').trim().toUpperCase(),pos=(c[2]||'').trim(),audio=(c[4]||'').trim(),key=word.toLowerCase();if(!word||!['B2','C1'].includes(level)||seen.has(key))continue;seen.add(key);out.push({word,level,pos,audio})}return out}
function loadVocabulary(done){if(vocabulary.length)return done();fetch(WORDS_URL).then(r=>{if(!r.ok)throw 0;return r.text()}).then(t=>{vocabulary=parseCSV(t);if(!vocabulary.length)throw 0;done()}).catch(()=>{vocabulary=SAMPLE.map(x=>({word:x.word,level:x.level,pos:x.pos,audio:x.audio}));done(true)})}
function renderCreate(){main.innerHTML='<div class="row"><div><h1>Create New Group</h1><p class="muted">Words already used in another group will not appear here.</p></div><button class="ghost" id="homeBtn">← Home</button></div><div class="card"><label>Group name</label><input id="groupName" placeholder="Example: September Week 1"><div id="loadState" class="notice">Loading the B2–C1 vocabulary library…</div><div id="picker" style="display:none"><div class="toolbar"><input id="search" placeholder="Search all available words…"><select id="level"><option value="ALL">B2 + C1</option><option value="B2">B2</option><option value="C1">C1</option></select></div><div><span class="selectedCount" id="selectedCount">0 selected</span> <span class="small">· choose as many as you want</span></div><div class="library" id="library"></div><div class="pager"><button class="ghost" id="prev">← Previous</button><span class="small" id="pageInfo"></span><button class="ghost" id="next">Next →</button></div><button class="primary" id="saveGroup">Create Group</button></div></div>';homeBtn.onclick=renderHome;loadVocabulary(setupPicker)}
function setupPicker(fallback){const used=usedWords(),available=vocabulary.filter(x=>!used.has(x.word.toLowerCase())),selected=new Set();let page=0;const pageSize=30;picker.style.display='block';loadState.innerHTML=fallback?'<b>Offline fallback:</b> a small safe list is shown.':'<b>'+available.length.toLocaleString()+' unused B2–C1 words available.</b> Search or browse the whole list.';function filtered(){const q=search.value.trim().toLowerCase(),lev=level.value;return available.filter(x=>(!q||x.word.toLowerCase().includes(q))&&(lev==='ALL'||x.level===lev))}function draw(){const arr=filtered(),pages=Math.max(1,Math.ceil(arr.length/pageSize));page=Math.max(0,Math.min(page,pages-1));const items=arr.slice(page*pageSize,(page+1)*pageSize);library.innerHTML=items.length?items.map(x=>'<label class="wordrow"><input class="wordcheck" type="checkbox" data-word="'+esc(x.word)+'" '+(selected.has(x.word)?'checked':'')+'><div><b>'+esc(x.word)+'</b> <button type="button" class="ghost speakBtn" data-word="'+esc(x.word)+'" data-audio="'+esc(x.audio)+'">🔊</button><div class="details">'+esc(x.pos)+'</div></div><span class="level">'+x.level+'</span></label>').join(''):'<p class="muted">No matching unused words.</p>';pageInfo.textContent='Page '+(page+1)+' of '+pages+' · '+arr.length+' words';document.querySelectorAll('.wordcheck').forEach(ch=>ch.onchange=()=>{ch.checked?selected.add(ch.dataset.word):selected.delete(ch.dataset.word);selectedCount.textContent=selected.size+' selected'});document.querySelectorAll('.speakBtn').forEach(b=>b.onclick=e=>speakWord(b.dataset.word,b.dataset.audio,e))}search.oninput=()=>{page=0;draw()};level.onchange=()=>{page=0;draw()};prev.onclick=()=>{page--;draw()};next.onclick=()=>{page++;draw()};draw();saveGroup.onclick=()=>{const name=groupName.value.trim();if(!name||!selected.size)return alert('Please name the group and choose at least one word.');const words=[...selected].map(w=>{const v=available.find(x=>x.word===w)||{word:w};const sample=SAMPLE.find(s=>s.word===w);if(sample)detailsCache[w]=sample;return{word:w,status:'active',score:0,level:v.level||'',pos:v.pos||'',audio:v.audio||''}});groups.push({name,words});save();renderHome()}}
function getDetails(item,done){if(detailsCache[item.word])return done(detailsCache[item.word]);fetch(DICT_URL+encodeURIComponent(item.word)).then(r=>{if(!r.ok)throw 0;return r.json()}).then(data=>{const e=data[0]||{},meanings=e.meanings||[],m=meanings.find(z=>!item.pos||z.partOfSpeech===item.pos)||meanings[0]||{},d=(m.definitions||[])[0]||{},obj={word:item.word,phonetic:e.phonetic||'',definition:d.definition||'Definition unavailable.',example:d.example||'No example sentence is available yet.',audio:item.audio||''};detailsCache[item.word]=obj;save();done(obj)}).catch(()=>done({word:item.word,phonetic:'',definition:'Definition unavailable right now.',example:'Example unavailable right now.',audio:item.audio||''}))}
function renderGroup(i){currentGroupIndex=i;const g=groups[i];let h='<div class="row"><div><h1>'+esc(g.name)+'</h1><p class="muted">'+g.words.length+' words</p></div><button class="ghost" id="homeBtn">← Groups</button></div><div class="card"><button class="primary" id="learnBtn">Learn words</button> <button class="primary" id="testBtn">Test my knowledge</button><p class="muted">Test currently includes: Description → type + Sentence → missing word + Listen → type.</p></div>';g.words.forEach(item=>h+='<div class="card"><b>'+esc(item.word)+'</b> <span class="small">'+esc(item.level)+' '+esc(item.pos)+'</span> <button class="ghost speakBtn" data-word="'+esc(item.word)+'" data-audio="'+esc(item.audio)+'">🔊</button></div>');main.innerHTML=h;homeBtn.onclick=renderHome;learnBtn.onclick=startLearn;testBtn.onclick=startTest;document.querySelectorAll('.speakBtn').forEach(b=>b.onclick=e=>speakWord(b.dataset.word,b.dataset.audio,e))}
function startLearn(){learnIndex=0;learnFlipped=false;renderLearn()}
function renderLearn(){const active=groups[currentGroupIndex].words.filter(x=>x.status!=='mastered');if(!active.length){alert('There are no Active words in this group.');return renderGroup(currentGroupIndex)}learnIndex=(learnIndex+active.length)%active.length;const item=active[learnIndex];main.innerHTML='<div class="learnWrap"><div class="row"><h2>Learn words</h2><button class="ghost" id="backGroup">← Group</button></div><div class="card flash" id="flashCard"><div class="muted">Loading word details…</div></div><div class="counter">'+(learnIndex+1)+' of '+active.length+'</div><div class="row center"><button class="ghost" id="prevWord">← Previous</button><button class="primary" id="nextWord">Next →</button></div></div>';backGroup.onclick=()=>renderGroup(currentGroupIndex);prevWord.onclick=()=>{learnIndex--;learnFlipped=false;renderLearn()};nextWord.onclick=()=>{learnIndex++;learnFlipped=false;renderLearn()};getDetails(item,d=>{const card=document.getElementById('flashCard');if(!card)return;card.innerHTML=!learnFlipped?'<div><div><span class="flashWord">'+esc(item.word)+'</span><button class="ghost speakBtn" id="learnSpeak">🔊</button></div><div class="ipa">'+esc(d.phonetic)+'</div><p class="muted">Tap the card to flip</p></div>':'<div><div class="meaning">'+esc(d.definition)+'</div><div class="example">'+esc(d.example)+'</div><p class="muted">Tap the card to see the word again</p></div>';card.onclick=()=>{learnFlipped=!learnFlipped;renderLearn()};const sp=document.getElementById('learnSpeak');if(sp)sp.onclick=e=>speakWord(item.word,item.audio||d.audio,e)})}
function makeGapSentence(item,d){let sentence=(d.example||'').trim(),lower=sentence.toLowerCase(),target=item.word.toLowerCase(),idx=lower.indexOf(target);if(!sentence||idx<0){const pos=(item.pos||'').toLowerCase();if(pos.includes('verb')||pos==='v')sentence='They decided to '+item.word+' the issue before the final meeting.';else if(pos.includes('adj'))sentence='The result seemed '+item.word+' to everyone involved.';else if(pos.includes('adv'))sentence='She responded '+item.word+' during the discussion.';else sentence='The report discussed '+item.word+' in detail.';lower=sentence.toLowerCase();idx=lower.indexOf(target)}return idx>=0?sentence.slice(0,idx)+'__________'+sentence.slice(idx+item.word.length):sentence}
function startTest(){const active=groups[currentGroupIndex].words.filter(x=>x.status!=='mastered');if(!active.length)return alert('There are no Active words to test.');testItems=[];active.forEach(item=>{testItems.push({item,type:'definition'});testItems.push({item,type:'gap'});testItems.push({item,type:'listen'})});testItems=testItems.sort(()=>Math.random()-.5);testIndex=0;testCorrect=0;renderTest()}
function renderTest(){if(testIndex>=testItems.length)return finishTest();const q=testItems[testIndex],item=q.item;let mode='Description → type the word',loading='Loading description…';if(q.type==='gap'){mode='Sentence → type the missing word';loading='Loading sentence…'}if(q.type==='listen'){mode='Listen → type the word';loading='Loading audio…'}main.innerHTML='<div class="testWrap"><div class="row"><div><div class="mode">'+mode+'</div><div class="muted">'+(testIndex+1)+' of '+testItems.length+'</div></div><button class="ghost" id="endTest">End test</button></div><div class="card"><div id="testPrompt" class="testPrompt"><span class="muted">'+loading+'</span></div><input id="answerInput" autocomplete="off" autocapitalize="off" placeholder="Type the word"><p class="small">Press ENTER to check · Capital letters are forgiven.</p><div class="row"><button class="ghost" id="dontKnow">I don\'t know</button><button class="primary" id="checkBtn">Check</button></div><div id="feedback"></div></div></div>';endTest.onclick=()=>renderGroup(currentGroupIndex);dontKnow.onclick=()=>checkAnswer(false);checkBtn.onclick=()=>checkAnswer();answerInput.onkeydown=e=>{if(e.key==='Enter')checkAnswer()};if(q.type==='listen'){const p=document.getElementById('testPrompt');p.innerHTML='<button class="primary" id="playTestWord">🔊 Play word</button><p class="small">Listen carefully, then type what you hear.</p>';playTestWord.onclick=e=>speakWord(item.word,item.audio,e);setTimeout(()=>speakWord(item.word,item.audio),250)}else getDetails(item,d=>{const p=document.getElementById('testPrompt');if(p)p.textContent=q.type==='gap'?makeGapSentence(item,d):d.definition})}
function goNextTest(){testIndex++;renderTest()}
function checkAnswer(force){const item=testItems[testIndex].item,input=document.getElementById('answerInput');if(!input)return;const ok=force===false?false:input.value.trim().toLowerCase()===item.word.trim().toLowerCase();checkBtn.disabled=true;dontKnow.disabled=true;if(ok){testCorrect++;input.disabled=true;feedback.innerHTML='<div class="feedback correct">✓ Correct</div><div style="margin-top:12px;text-align:right"><button class="primary" id="nextTest">Next →</button></div>';nextTest.onclick=goNextTest;return}feedback.innerHTML='<div class="feedback wrong">✕ Answer: <b>'+esc(item.word)+'</b><div class="small" style="margin-top:7px">This attempt stays wrong. Type the correct word once below to help memorize it — no point will be added.</div></div><div id="retryMessage"></div><div style="margin-top:12px;text-align:right"><button class="primary" id="retryBtn">Confirm typing</button></div>';input.value='';input.placeholder='Type the correct word';input.focus();const practice=()=>{const practiceOk=input.value.trim().toLowerCase()===item.word.trim().toLowerCase();const msg=document.getElementById('retryMessage');if(!practiceOk){msg.innerHTML='<div class="small" style="margin-top:10px;color:var(--bad)">Type the correct word exactly as shown above.</div>';input.select();return}input.disabled=true;retryBtn.disabled=true;msg.innerHTML='<div class="feedback correct">✓ Good — you typed <b>'+esc(item.word)+'</b>. No point was added.</div><div style="margin-top:12px;text-align:right"><button class="primary" id="nextTest">Next →</button></div>';nextTest.onclick=goNextTest};retryBtn.onclick=practice;input.onkeydown=e=>{if(e.key==='Enter')practice()}}
function finishTest(){main.innerHTML='<div class="testWrap"><div class="card" style="text-align:center"><h1>Test complete</h1><p>You got <b>'+testCorrect+' of '+testItems.length+'</b> correct.</p><p class="muted">Wrong first attempts stayed wrong even when you retyped the answer for practice.</p><button class="primary" id="backAfterTest">Back to group</button></div></div>';backAfterTest.onclick=()=>renderGroup(currentGroupIndex)}
document.getElementById('logo').onclick=renderHome;renderHome();
</script></body></html>
