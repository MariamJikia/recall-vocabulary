<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Recall Vocabulary</title>
<style>
:root{--bg:#f7f8fc;--card:#fff;--text:#202331;--muted:#747b88;--line:#e4e7ef;--purple:#5b5bd6;--purple2:#ececff;--green:#16834a;--red:#bd3b3b;--gold:#b57914}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:1020px;margin:auto;padding:24px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.logo{font-size:28px;font-weight:850;cursor:pointer}.logo span{color:var(--purple)}.muted{color:var(--muted)}.small{font-size:12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 4px 20px rgba(27,30,45,.04);margin-bottom:15px}
h1,h2,h3{margin-top:0}button{border:0;border-radius:12px;padding:11px 15px;font-weight:750;cursor:pointer;font:inherit}
.primary{background:var(--purple);color:#fff}.secondary{background:#eef0f5;color:#303443}.ghost{background:#fff;border:1px solid var(--line)}
.danger{background:#fff0f0;color:var(--red)}.success{background:#edf8f1;color:var(--green)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.hidden{display:none!important}
.groupgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.groupcard{cursor:pointer;min-height:145px;display:flex;flex-direction:column;justify-content:space-between}
.createCard{border:2px dashed #cfd3df;background:transparent;text-align:center;display:grid;place-items:center}.plus{font-size:44px;color:var(--purple)}
.badges{display:flex;gap:7px;flex-wrap:wrap}.badge{padding:5px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#f0f1f6}.activeB{color:#695100;background:#fff7d9}.masterB{color:#11643a;background:#eaf7ef}
input,textarea,select{width:100%;padding:12px 13px;border:1px solid #daddE7;border-radius:12px;background:white;font:inherit}textarea{min-height:78px}
label{display:block;margin:0 0 6px;font-size:12px;font-weight:750;color:var(--muted)}.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:10px}
.library{display:grid;gap:9px;max-height:520px;overflow:auto;padding-right:4px}.librow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:13px;border:1px solid var(--line);border-radius:14px}
.check{width:21px;height:21px;margin-top:3px}.ipa{color:#555;font-size:13px}.example{color:#676d79;font-size:13px;margin-top:5px}.level{font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px;background:var(--purple2);color:#4646aa}
.tabs{display:flex;gap:8px;margin:14px 0}.tab.on{background:var(--purple);color:#fff}.wordrow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #eef0f4}
.wordrow:last-child{border:0}.score{font-weight:850;color:var(--purple)}
.test{max-width:780px;margin:25px auto}.testbox{text-align:center;padding:34px 25px}.mode{font-size:12px;font-weight:850;color:var(--purple);text-transform:uppercase;letter-spacing:.07em}
.counter{font-size:13px;color:var(--muted)}.prompt{font-size:24px;line-height:1.4;margin:25px auto;max-width:680px}
.answer{max-width:560px;margin:auto}.feedback{padding:12px;border-radius:12px;margin:14px auto 0;max-width:560px;font-weight:750}.ok{background:#edf8f1;color:var(--green)}.bad{background:#fff0f0;color:var(--red)}
.progress{height:8px;background:#eceef4;border-radius:99px;overflow:hidden;margin:14px 0}.progress>div{height:100%;background:var(--purple)}
.flash{max-width:650px;margin:30px auto;text-align:center;min-height:330px;display:flex;flex-direction:column;justify-content:center}.flash .word{font-size:42px;font-weight:850}.flash .meaning{font-size:20px;line-height:1.5}
.note{background:#fff9e8;border:1px solid #f2e4b6;color:#76560a;padding:12px;border-radius:12px;font-size:13px}
@media(max-width:720px){.groupgrid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.librow{grid-template-columns:auto 1fr}.librow .level{grid-column:2}}
</style>
</head>

let groups=JSON.parse(localStorage.getItem("recall_v3_groups")||"[]");
let currentGroup=null, selected=new Set(), currentTab="active";
let learnIndex=0, learnFlipped=false;
let session=[], qIndex=0, qLocked=false, sessionScores={};

function save(){localStorage.setItem("recall_v3_groups",JSON.stringify(groups))}
function show(id){["home","builder","group","learn","test"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==id))}
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]))}
function norm(s){return String(s||"").trim().toLowerCase().replace(/\s+/g," ")}
function getG(){return groups.find(g=>g.id===currentGroup)}
function getWord(w){return DB.find(x=>x.word===w)}
function exampleFor(o,n=1){
  const d=(o.definition||"").toLowerCase(), w=o.word;
  if(d.startsWith("to ")||d.includes(" to ")) return n===1?`They decided to ${w} the issue before the final meeting.`:`The manager asked the team to ${w} the plan carefully.`;
  if(d.includes("adverb")||w.endsWith("ly")) return n===1?`She responded ${w} during the discussion.`:`The situation changed ${w} after the announcement.`;
  if(d.startsWith("having")||d.startsWith("being")||d.includes("describing")) return n===1?`The result was surprisingly ${w}.`:`His explanation sounded ${w} to the audience.`;
  return n===1?`The report discussed ${w} in detail.`:`They considered the importance of ${w} in this situation.`;
}

function goHome(){
 currentGroup=null; show("home");
 let h=`<h1>Your groups</h1><p class="muted">Choose a group, or create a new one.</p><div class="groupgrid">`;
 for(const g of groups){
  const a=g.words.filter(w=>w.status!=="mastered").length,m=g.words.filter(w=>w.status==="mastered").length;
  h+=`<div class="card groupcard" onclick="openGroup('${g.id}')"><div><h2>${esc(g.name)}</h2><div class="muted">${g.words.length} words</div></div><div class="badges"><span class="badge activeB">${a} Active</span><span class="badge masterB">${m} Mastered</span></div></div>`;
 }
 h+=`<div class="card groupcard createCard" onclick="newGroup()"><div><div class="plus">＋</div><h2>Create New Group</h2></div></div></div>`;
 if(!groups.length) h=`<div class="card createCard groupcard" onclick="newGroup()" style="max-width:520px;margin:70px auto"><div><div class="plus">＋</div><h1>Create New Group</h1><p class="muted">Choose vocabulary from the built-in library.</p></div></div>`;
 document.getElementById("home").innerHTML=h;
}
function newGroup(){selected=new Set();show("builder");renderBuilder()}
function renderBuilder(){
 const el=document.getElementById("builder");
 el.innerHTML=`<div class="row between"><div><h1>Create New Group</h1><p class="muted">Name it, then press + to choose words.</p></div><button class="ghost" onclick="goHome()">← Home</button></div>
 <div class="card"><label>Group name</label><input id="gname" placeholder="Example: September Week 1"><div class="row" style="margin-top:14px"><button class="primary" onclick="openPicker()">＋ Add words</button><span id="selCount" class="muted">${selected.size} selected</span></div></div>
 <div id="picker" class="hidden"></div>
 <div class="row between"><div></div><button class="primary" onclick="finishGroup()">Create Group</button></div>`;
}
function openPicker(){
 const p=document.getElementById("picker");p.classList.remove("hidden");
 p.innerHTML=`<div class="card"><div class="row between"><div><h2 style="margin:0">Vocabulary library</h2><div class="small">${DB.length.toLocaleString()} NGSL + academic words</div></div><button class="ghost" onclick="document.getElementById('picker').classList.add('hidden')">Done</button></div>
 <div class="toolbar" style="margin:14px 0"><input id="search" placeholder="Search word or meaning…" oninput="renderLibrary()"><select id="lev" onchange="renderLibrary()"><option value="focus">B2–C1 focus</option><option value="B2">B2</option><option value="C1">C1 / academic</option><option value="all">All</option></select><button class="secondary" onclick="selectVisible()">Select visible</button></div>
 <div class="note">Level labels are a practical frequency-based filter in this prototype, not official CEFR labels for every individual meaning.</div><div id="lib" class="library" style="margin-top:12px"></div></div>`;
 renderLibrary();
}
function visibleRows(){
 const q=norm(document.getElementById("search")?.value||""), lev=document.getElementById("lev")?.value||"focus";
 let rows=DB.filter(o=>!q||norm(o.word).includes(q)||norm(o.definition).includes(q));
 if(lev==="B2") rows=rows.filter(o=>o.level==="B2");
 if(lev==="C1") rows=rows.filter(o=>o.level==="C1");
 if(lev==="focus") rows=rows.filter(o=>o.level==="B2"||o.level==="C1");
 return rows.slice(0,250);
}
function renderLibrary(){
 const rows=visibleRows(), lib=document.getElementById("lib"); if(!lib)return;
 lib.innerHTML=rows.map(o=>`<div class="librow"><input class="check" type="checkbox" ${selected.has(o.word)?"checked":""} onchange="toggleWord('${o.word.replace(/'/g,"\\'")}',this.checked)">
 <div><strong>${esc(o.word)}</strong> <span class="ipa">${esc(o.ipa)}</span><div>${esc(o.definition)}</div><div class="example">Example: ${esc(exampleFor(o,1))}</div></div><span class="level">${o.level}</span></div>`).join("");
}
function toggleWord(w,on){on?selected.add(w):selected.delete(w);let c=document.getElementById("selCount");if(c)c.textContent=`${selected.size} selected`}
function selectVisible(){visibleRows().forEach(o=>selected.add(o.word));renderLibrary();let c=document.getElementById("selCount");if(c)c.textContent=`${selected.size} selected`}
function finishGroup(){
 const name=document.getElementById("gname").value.trim(); if(!name){alert("Please name the group.");return}
 if(!selected.size){alert("Please add at least one word.");return}
 const id="g"+Date.now(); groups.push({id,name,words:[...selected].map(w=>({word:w,status:"active",score:0}))});save();openGroup(id)
}
function openGroup(id){currentGroup=id;currentTab="active";show("group");renderGroup()}
function renderGroup(){
 const g=getG(); if(!g){goHome();return}
 const active=g.words.filter(x=>x.status!=="mastered"), mastered=g.words.filter(x=>x.status==="mastered");
 const list=currentTab==="active"?active:mastered;
 document.getElementById("group").innerHTML=`<div class="row between"><div><h1>${esc(g.name)}</h1><div class="badges"><span class="badge activeB">${active.length} Active</span><span class="badge masterB">${mastered.length} Mastered</span></div></div><button class="ghost" onclick="goHome()">← Groups</button></div>
 <div class="card"><div class="row"><button class="primary" onclick="startLearn()">Learn words</button><button class="primary" onclick="startTest()">Test my knowledge</button><button class="secondary" onclick="addMore()">＋ Add words</button></div></div>
 <div class="tabs"><button class="tab ${currentTab==="active"?"on":"secondary"}" onclick="currentTab='active';renderGroup()">Active</button><button class="tab ${currentTab==="mastered"?"on":"secondary"}" onclick="currentTab='mastered';renderGroup()">Mastered</button></div>
 <div class="card">${list.length?list.map(x=>{const o=getWord(x.word);return `<div class="wordrow"><div><strong>${esc(x.word)}</strong> <span class="ipa">${esc(o?.ipa||"")}</span><div class="small">${esc(o?.definition||"")}</div></div><div class="row"><span class="score">${x.score||0}/7</span><button class="ghost" onclick="manualMove('${x.word.replace(/'/g,"\\'")}')">${currentTab==="active"?"Move to Mastered":"Move to Active"}</button></div></div>`}).join(""):`<div class="muted">No words here.</div>`}</div>`;
}
function manualMove(w){const x=getG().words.find(x=>x.word===w);x.status=x.status==="mastered"?"active":"mastered";if(x.status==="mastered")x.score=7;else x.score=0;save();renderGroup()}
function addMore(){selected=new Set(getG().words.map(x=>x.word));show("builder");renderBuilder();document.getElementById("gname").value=getG().name;openPicker();
 const btn=[...document.querySelectorAll("#builder button")].find(b=>b.textContent==="Create Group"); if(btn){btn.textContent="Save Group";btn.onclick=()=>{const g=getG();g.name=document.getElementById("gname").value.trim()||g.name;const old=new Map(g.words.map(x=>[x.word,x]));g.words=[...selected].map(w=>old.get(w)||{word:w,status:"active",score:0});save();openGroup(g.id)}}
function startLearn(){learnIndex=0;learnFlipped=false;show("learn");renderLearn()}
function renderLearn(){
 const g=getG(), arr=g.words.filter(x=>x.status!=="mastered"); if(!arr.length){document.getElementById("learn").innerHTML=`<div class="card">No Active words to learn. <button onclick="openGroup('${g.id}')">Back</button></div>`;return}
 const o=getWord(arr[learnIndex%arr.length].word);
 document.getElementById("learn").innerHTML=`<div class="row between"><h2>Learn · ${esc(g.name)}</h2><button class="ghost" onclick="openGroup('${g.id}')">← Group</button></div>
 <div class="card flash" onclick="learnFlipped=!learnFlipped;renderLearn()">${!learnFlipped?`<div class="word">${esc(o.word)}</div><div class="ipa">${esc(o.ipa)}</div><div class="small" style="margin-top:18px">Tap card to flip</div>`:`<div class="meaning">${esc(o.definition)}</div><div class="example" style="font-size:16px;margin-top:20px">${esc(exampleFor(o,1))}</div>`}</div>
 <div class="row" style="justify-content:center"><button class="secondary" onclick="event.stopPropagation();learnIndex=(learnIndex-1+${arr.length})%${arr.length};learnFlipped=false;renderLearn()">← Previous</button><span class="counter">${learnIndex+1} of ${arr.length}</span><button class="primary" onclick="event.stopPropagation();learnIndex=(learnIndex+1)%${arr.length};learnFlipped=false;renderLearn()">Next →</button></div>`;
}
function startTest(){
 const g=getG(), act=g.words.filter(x=>x.status!=="mastered"); if(!act.length){alert("No Active words to test.");return}
 session=[];sessionScores={};act.forEach(x=>{sessionScores[x.word]=0;["def1","gap1","listen","def2","gap2","speak","sentence"].forEach(t=>session.push({word:x.word,type:t}))});
 shuffle(session);qIndex=0;qLocked=false;show("test");renderQuestion()
}
function renderQuestion(){
 const g=getG(); if(qIndex>=session.length){finishTest();return}
 const q=session[qIndex],o=getWord(q.word);qLocked=false;
 let mode="",prompt="",box=`<div class="answer"><input id="ans" autofocus autocomplete="off" placeholder="Type your answer"><div class="small" style="margin-top:8px">Press ENTER to check</div><div class="row" style="justify-content:center;margin-top:12px"><button class="secondary" onclick="dontKnow()">I don't know</button></div></div>`;
 if(q.type.startsWith("def")){mode="Description → type the word";prompt=esc(o.definition)}
 if(q.type.startsWith("gap")){mode="Sentence → type the missing word";prompt=esc(exampleFor(o,q.type==="gap1"?1:2).replace(new RegExp("\\b"+o.word+"\\b","ig"),"__________"))}
 if(q.type==="listen"){mode="Listen → type the word";prompt=`<button class="primary" onclick="say('${o.word.replace(/'/g,"\\'")}')">🔊 Play word</button>`}
 if(q.type==="speak"){mode="Description → pronounce the word";prompt=esc(o.definition);box=`<div class="row" style="justify-content:center"><button class="primary" onclick="recognize()">🎤 Speak</button><button class="secondary" onclick="dontKnow()">I don't know</button></div><div class="small" style="margin-top:10px">The goal is understandable pronunciation, not a perfect American accent.</div>`}
 if(q.type==="sentence"){mode="Use the word in a sentence";prompt=`<strong>${esc(o.word)}</strong>`;box=`<div class="answer"><textarea id="sent" placeholder="Write a natural sentence using this word."></textarea><div class="row" style="justify-content:center;margin-top:10px"><button class="primary" onclick="checkSentence()">Check</button><button class="secondary" onclick="dontKnow()">I don't know</button></div></div>`}
 document.getElementById("test").innerHTML=`<div class="test"><div class="row between"><div><div class="mode">${mode}</div><div class="counter">${qIndex+1} of ${session.length}</div></div><button class="ghost" onclick="openGroup('${g.id}')">End test</button></div><div class="progress"><div style="width:${qIndex/session.length*100}%"></div></div><div class="card testbox"><div class="prompt">${prompt}</div>${box}<div id="fb"></div><div id="next" class="hidden" style="margin-top:14px"><button class="primary" onclick="nextQ()">Next</button></div></div></div>`;
 const a=document.getElementById("ans");if(a)a.addEventListener("keydown",e=>{if(e.key==="Enter")checkTyped()})
}
function result(ok,seen=""){
 if(qLocked)return;qLocked=true;const q=session[qIndex],o=getWord(q.word);if(ok)sessionScores[q.word]++;
 const fb=document.getElementById("fb");fb.innerHTML=`<div class="feedback ${ok?"ok":"bad"}">${ok?"✓ Correct":"✕ "+(seen?"Not quite. ":"")+"Answer: "+esc(o.word)}<div class="small" style="margin-top:5px">${esc(o.definition)}</div></div>`;
 document.getElementById("next").classList.remove("hidden")
}
function checkTyped(){const q=session[qIndex],a=document.getElementById("ans").value;result(norm(a)===norm(q.word),a)}
function dontKnow(){result(false,"")}
function nextQ(){qIndex++;renderQuestion()}
function say(w){if("speechSynthesis"in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(w);u.lang="en-US";u.rate=.86;speechSynthesis.speak(u)}}
function recognize(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert("Speech recognition works best in Chrome or Edge.");return}
 const target=session[qIndex].word,r=new SR();r.lang="en-US";r.maxAlternatives=5;r.interimResults=false;
 r.onresult=e=>{let a=[];for(let i=0;i<e.results[0].length;i++)a.push(e.results[0][i].transcript);result(a.some(t=>norm(t)===norm(target)||norm(t).split(" ").includes(norm(target))),a[0])};
 r.onerror=()=>{document.getElementById("fb").innerHTML=`<div class="feedback bad">I couldn't understand that. Please try again.</div>`};r.start()
}
function checkSentence(){
 const s=document.getElementById("sent").value.trim(),w=session[qIndex].word;
 const has=new RegExp("\\b"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i").test(s), enough=s.split(/\s+/).length>=5;
 result(has&&enough,s)
}
function finishTest(){
 const g=getG();g.words.forEach(x=>{if(sessionScores[x.word]!==undefined){x.score=sessionScores[x.word];x.status=x.score===7?"mastered":"active"}});save();
 const mastered=Object.values(sessionScores).filter(x=>x===7).length,total=Object.keys(sessionScores).length;
 document.getElementById("test").innerHTML=`<div class="test"><div class="card testbox"><h1>Test complete</h1><p><strong>${mastered}</strong> of ${total} words reached 7/7 and moved to Mastered.</p><p class="muted">Any word below 7/7 stays Active.</p><button class="primary" onclick="openGroup('${g.id}')">Back to group</button></div></div>`
}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
goHome()
</script>
</body></html>
