<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recall</title><style>:root{--p:#5b5bd6;--bg:#f7f8fc;--line:#e4e7ef;--muted:#737987;--green:#16834a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#202331}.app{max-width:950px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;margin-bottom:32px}.logo{font-size:30px;font-weight:850}.logo span{color:var(--p)}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #2221}.create{border:2px dashed #cfd3df;text-align:center;cursor:pointer;padding:55px 20px}.plus{font-size:45px;color:var(--p)}button{border:0;border-radius:12px;padding:11px 15px;font-weight:750;cursor:pointer}.primary{background:var(--p);color:#fff}.ghost{background:#fff;border:1px solid var(--line)}input,textarea{width:100%;padding:12px;border:1px solid #d9dce6;border-radius:12px;font:inherit;margin:6px 0 12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.hidden{display:none}.muted{color:var(--muted)}.groups{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.group{cursor:pointer;min-height:145px}.word{padding:12px 0;border-bottom:1px solid #eee}.badge{font-size:12px;background:#eef0f6;padding:5px 8px;border-radius:99px}.test{max-width:700px;margin:30px auto;text-align:center}.mode{font-size:12px;color:var(--p);font-weight:850;text-transform:uppercase}.prompt{font-size:24px;line-height:1.4;margin:28px 0}.feedback{padding:12px;border-radius:12px;margin-top:14px}.ok{background:#edf8f1;color:var(--green)}.bad{background:#fff0f0;color:#b33}.flash{text-align:center;min-height:300px;display:grid;place-items:center;cursor:pointer}.flash strong{font-size:40px}.tabs button.on{background:var(--p);color:white}@media(max-width:700px){.groups{grid-template-columns:1fr}}</style></head><body><div class="app"><div class="top"><div class="logo" onclick="home()">Re<span>call</span></div><div class="muted">Vocabulary memory trainer</div></div><main id="main"></main></div><script>
const LIB=[['reluctant','/rɪˈlʌktənt/','Not willing or eager to do something; hesitant.','She was reluctant to discuss what happened.'],['acknowledge','/əkˈnɑːlɪdʒ/','To accept, admit, or recognize that something is true or exists.','He acknowledged that the project took longer than expected.'],['subtle','/ˈsʌtəl/','Not obvious or easy to notice; delicate or indirect.','There was a subtle change in her tone.'],['inevitable','/ɪnˈevɪtəbəl/','Certain to happen and impossible to avoid.','Some delays were inevitable.'],['convey','/kənˈveɪ/','To communicate or express an idea, feeling, or message.','Her expression conveyed disappointment.'],['ambiguous','/æmˈbɪɡjuəs/','Having more than one possible meaning; unclear.','The instructions were deliberately ambiguous.'],['coherent','/koʊˈhɪrənt/','Logical, clear, and consistent.','She gave a coherent explanation.'],['deteriorate','/dɪˈtɪriəreɪt/','To become progressively worse.','The weather began to deteriorate.'],['elaborate','/ɪˈlæbərət/','Detailed and complicated in design or planning.','They prepared an elaborate presentation.'],['feasible','/ˈfiːzəbəl/','Possible and practical to do successfully.','The committee decided the plan was feasible.'],['inherent','/ɪnˈhɪrənt/','Existing as a natural or basic part of something.','Risk is inherent in the process.'],['scrutinize','/ˈskruːtənaɪz/','To examine something very carefully.','The accountant scrutinized the records.']];
let groups=JSON.parse(localStorage.getItem('recall_groups')||'[]'),gid=null,tab='active',learnI=0,flip=false,session=[],qi=0,scores={};const M=document.getElementById('main');function save(){localStorage.setItem('recall_groups',JSON.stringify(groups))}function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function G(){return groups.find(g=>g.id===gid)}function W(w){return LIB.find(x=>x[0]===w)}function home(){gid=null;let h='<h1>Your groups</h1><p class="muted">Choose a group or create a new one.</p><div class="groups">';groups.forEach(g=>{let a=g.words.filter(x=>x.status!='mastered').length,m=g.words.length-a;h+=`<div class="card group" onclick="openG('${g.id}')"><h2>${esc(g.name)}</h2><p>${g.words.length} words</p><span class="badge">${a} Active</span> <span class="badge">${m} Mastered</span></div>`});h+='<div class="card create" onclick="createG()"><div class="plus">＋</div><h2>Create New Group</h2></div></div>';if(!groups.length)h='<div class="card create" style="max-width:520px;margin:70px auto" onclick="createG()"><div class="plus">＋</div><h1>Create New Group</h1><p class="muted">Choose words for your first group.</p></div>';M.innerHTML=h}function createG(){M.innerHTML='<div class="row between"><h1>Create New Group</h1><button class="ghost" onclick="home()">← Home</button></div><div class="card"><label>Group name</label><input id="name" placeholder="September Week 1"><h3>＋ Choose words</h3><p class="muted">The full B2–C1 library is being added. These words let you test the complete app flow now.</p><div id="pick"></div><button class="primary" onclick="finishG()">Create Group</button></div>';document.getElementById('pick').innerHTML=LIB.map(x=>`<label class="word"><input style="width:auto" type="checkbox" value="${x[0]}"> <b>${x[0]}</b> ${x[1]}<br><span class="muted">${x[2]}</span></label>`).join('')}function finishG(){let name=document.getElementById('name').value.trim(),ws=[...document.querySelectorAll('#pick input:checked')].map(x=>({word:x.value,status:'active',score:0}));if(!name||!ws.length){alert('Please name the group and choose at least one word.');return}let id='g'+Date.now();groups.push({id,name,words:ws});save();openG(id)}function openG(id){gid=id;tab='active';renderG()}function renderG(){let g=G(),list=g.words.filter(x=>tab==='mastered'?x.status==='mastered':x.status!=='mastered');M.innerHTML=`<div class="row between"><div><h1>${esc(g.name)}</h1><span class="badge">${g.words.filter(x=>x.status!='mastered').length} Active</span> <span class="badge">${g.words.filter(x=>x.status==='mastered').length} Mastered</span></div><button class="ghost" onclick="home()">← Groups</button></div><div class="card row"><button class="primary" onclick="startLearn()">Learn words</button><button class="primary" onclick="startTest()">Test my knowledge</button></div><div class="tabs"><button class="${tab==='active'?'on':''}" onclick="tab='active';renderG()">Active</button> <button class="${tab==='mastered'?'on':''}" onclick="tab='mastered';renderG()">Mastered</button></div><div class="card">${list.length?list.map(x=>{let w=W(x.word);return `<div class="word row between"><div><b>${x.word}</b> ${w[1]}<div class="muted">${w[2]}</div></div><div><b>${x.score}/7</b> <button class="ghost" onclick="move('${x.word}')">Move to ${tab==='active'?'Mastered':'Active'}</button></div></div>`}).join(''):'<p class="muted">No words here.</p>'}</div>`}function move(w){let x=G().words.find(x=>x.word===w);x.status=x.status==='mastered'?'active':'mastered';x.score=x.status==='mastered'?7:0;save();renderG()}function startLearn(){learnI=0;flip=false;learn()}function learn(){let a=G().words.filter(x=>x.status!='mastered');if(!a.length){renderG();return}let w=W(a[learnI%a.length].word);M.innerHTML=`<div class="row between"><h2>Learn words</h2><button class="ghost" onclick="renderG()">← Group</button></div><div class="card flash" onclick="flip=!flip;learn()">${flip?`<div><p style="font-size:22px">${w[2]}</p><p>${w[3]}</p></div>`:`<div><strong>${w[0]}</strong><p>${w[1]}</p><p class="muted">Tap to flip</p></div>`}</div><div class="row" style="justify-content:center"><button onclick="learnI=(learnI-1+a.length)%a.length;flip=false;learn()">← Previous</button><span>${learnI+1} of ${a.length}</span><button class="primary" onclick="learnI=(learnI+1)%a.length;flip=false;learn()">Next →</button></div>`}function startTest(){let a=G().words.filter(x=>x.status!='mastered');if(!a.length){alert('No Active words.');return}session=[];scores={};a.forEach(x=>{scores[x.word]=0;['def','gap','listen','def','gap','speak','sentence'].forEach(t=>session.push({w:x.word,t}))});session.sort(()=>Math.random()-.5);qi=0;question()}function question(){if(qi>=session.length){finishTest();return}let q=session[qi],w=W(q.w),mode='',p='',box='<input id="ans" placeholder="Type your answer"><p class="muted">Press ENTER to check</p><button onclick="answer(false)">I don\'t know</button>';if(q.t==='def'){mode='Description → type the word';p=w[2]}if(q.t==='gap'){mode='Sentence → type the missing word';p=w[3].replace(new RegExp('\\b'+w[0]+'\\b','i'),'__________')}if(q.t==='listen'){mode='Listen → type the word';p=`<button class="primary" onclick="say('${w[0]}')">🔊 Play word</button>`}if(q.t==='speak'){mode='Description → pronounce the word';p=w[2];box='<button class="primary" onclick="recognize()">🎤 Speak</button> <button onclick="answer(false)">I don\'t know</button><p class="muted">Understandable foreign accents are okay.</p>'}if(q.t==='sentence'){mode='Use the word in a sentence';p='<b>'+w[0]+'</b>';box='<textarea id="sent" placeholder="Write a sentence using the word"></textarea><button class="primary" onclick="sentence()">Check</button> <button onclick="answer(false)">I don\'t know</button>'}M.innerHTML=`<div class="test"><div class="row between"><div><div class="mode">${mode}</div><div class="muted">${qi+1} of ${session.length}</div></div><button class="ghost" onclick="renderG()">End test</button></div><div class="card"><div class="prompt">${p}</div>${box}<div id="fb"></div><div id="next" class="hidden"><button class="primary" onclick="qi++;question()">Next</button></div></div></div>`;let a=document.getElementById('ans');if(a)a.addEventListener('keydown',e=>{if(e.key==='Enter')answer(a.value.trim().toLowerCase()===q.w.toLowerCase())})}function answer(ok){let q=session[qi],w=W(q.w);if(ok)scores[q.w]++;document.getElementById('fb').innerHTML=`<div class="feedback ${ok?'ok':'bad'}">${ok?'✓ Correct':'✕ Answer: '+w[0]}<br><span>${w[2]}</span></div>`;document.getElementById('next').classList.remove('hidden')}function sentence(){let q=session[qi],s=document.getElementById('sent').value;answer(new RegExp('\\b'+q.w+'\\b','i').test(s)&&s.trim().split(/\s+/).length>=5)}function say(w){let u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}function recognize(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Speech recognition works best in Chrome or Edge.');return}let q=session[qi],r=new SR();r.lang='en-US';r.maxAlternatives=5;r.onresult=e=>{let ok=false;for(let i=0;i<e.results[0].length;i++)if(e.results[0][i].transcript.toLowerCase().includes(q.w.toLowerCase()))ok=true;answer(ok)};r.start()}function finishTest(){let g=G();g.words.forEach(x=>{if(scores[x.word]!==undefined){x.score=scores[x.word];x.status=x.score===7?'mastered':'active'}});save();M.innerHTML=`<div class="test card"><h1>Test complete</h1><p>Words with <b>7/7</b> moved to Mastered. Words below 7 stay Active.</p><button class="primary" onclick="renderG()">Back to group</button></div>`}home();
</script></body></html>
