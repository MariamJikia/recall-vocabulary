<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recall</title>
<style>
:root{--p:#5b5bd6;--bg:#f7f8fc;--line:#e4e7ef;--muted:#747b88;--ok:#16834a;--bad:#b53a3a;--soft:#eeeeff}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#202331}.app{max-width:1020px;margin:auto;padding:28px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.logo{font-size:30px;font-weight:850;cursor:pointer}.logo span{color:var(--p)}.muted{color:var(--muted)}.small{font-size:12px;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #2221}.create{border:2px dashed #cfd3df;text-align:center;padding:45px 20px;cursor:pointer}.plus{font-size:42px;color:var(--p)}button{border:0;border-radius:12px;padding:11px 15px;font-weight:750;cursor:pointer;font:inherit}.primary{background:var(--p);color:#fff}.ghost{background:#fff;border:1px solid var(--line)}.secondary{background:#eef0f5}.danger{background:#fff0f0;color:var(--bad)}input,textarea,select{width:100%;padding:12px 13px;border:1px solid #d9dce6;border-radius:12px;font:inherit;background:#fff}textarea{min-height:90px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.center{justify-content:center}.groups{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.group{cursor:pointer;min-height:135px}.badges{display:flex;gap:8px;flex-wrap:wrap}.badge{font-size:11px;font-weight:800;padding:5px 8px;border-radius:99px;background:#eef0f6}.badge.active{background:#fff6d8;color:#745900}.badge.master{background:#eaf7ef;color:#11643a}.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin:14px 0}.library{border:1px solid var(--line);border-radius:16px;padding:0 12px}.librow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:13px 0;border-bottom:1px solid #eee}.librow:last-child{border:0}.check{width:20px;height:20px;margin-top:4px}.ipa{color:#5f6570;font-size:13px}.example{color:#686f7b;font-size:13px;margin-top:5px}.level{font-size:11px;font-weight:800;background:var(--soft);color:#4646a9;padding:5px 8px;border-radius:99px;height:max-content}.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin:14px 0}.tabs{display:flex;gap:8px;margin:14px 0}.tabs button.on{background:var(--p);color:#fff}.wordrow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #eee}.wordrow:last-child{border:0}.score{font-weight:850;color:var(--p)}.learnWrap,.testWrap{max-width:760px;margin:25px auto}.flash{min-height:340px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer}.flashWord{font-size:44px;font-weight:850}.speakBtn{font-size:20px;padding:7px 9px;margin-left:6px}.meaning{font-size:22px;line-height:1.5}.counter{text-align:center;color:var(--muted);margin:12px 0}.mode{font-size:12px;font-weight:850;color:var(--p);text-transform:uppercase;letter-spacing:.07em}.prompt{font-size:24px;line-height:1.4;margin:26px auto;max-width:680px;text-align:center}.feedback{padding:12px;border-radius:12px;margin-top:14px;font-weight:700}.ok{background:#edf8f1;color:var(--ok)}.bad{background:#fff0f0;color:var(--bad)}.progress{height:8px;background:#eceef4;border-radius:99px;overflow:hidden;margin:12px 0 20px}.progress>div{height:100%;background:var(--p)}@media(max-width:720px){.groups{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.librow{grid-template-columns:auto 1fr}.level{grid-column:2}.wordrow{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body><div class="app"><div class="top"><div class="logo" id="logo">Re<span>call</span></div><div class="muted">Vocabulary memory trainer</div></div><main id="main"><div class="card create"><div class="plus">＋</div><h1>Create New Group</h1><p class="muted">Choose words for your first group.</p><button class="primary" id="fallbackCreate">Create New Group</button></div></main></div>
<script>
const CSV_URL='https://raw.githubusercontent.com/nalgeon/words/main/data/oxford-5k.csv';
const DICT='https://api.dictionaryapi.dev/api/v2/entries/en/';
const main=document.getElementById('main');let vocabulary=[];let groups=[];let cache={};
try{groups=JSON.parse(localStorage.getItem('recall_groups')||'[]')}catch(e){groups=[]}try{cache=JSON.parse(localStorage.getItem('recall_dict_cache')||'{}')}catch(e){cache={}}
let currentGroup=null,currentTab='active',learnIndex=0,learnFlipped=false,session=[],qIndex=0,scores={},locked=false;
function save(){localStorage.setItem('recall_groups',JSON.stringify(groups));localStorage.setItem('recall_dict_cache',JSON.stringify(cache))}function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}function G(){return groups.find(g=>g.id===currentGroup)}function usedWords(){const s=new Set();groups.forEach(g=>g.words.forEach(x=>s.add(x.word)));return s}
async function loadVocabulary(){if(vocabulary.length)return;const r=await fetch(CSV_URL);if(!r.ok)throw new Error('Could not load vocabulary');const text=await r.text();const seen=new Set();vocabulary=text.split(/\r?\n/).slice(1).map(line=>line.split(',')).filter(c=>c.length>=3&&['b2','c1'].includes((c[1]||'').toLowerCase())).map(c=>({word:c[0].trim(),level:c[1].toUpperCase(),pos:c[2].trim()})).filter(x=>x.word&&!seen.has(x.word)&&(seen.add(x.word),true));}
function fallbackDetail(word,pos=''){return{word,phonetic:'',audio:'',pos,definition:'Definition temporarily unavailable.',example:`This is an example using the word ${word}.`,example2:`Try using ${word} in another natural sentence.`}}
async function details(word,pos=''){if(cache[word])return cache[word];try{const r=await fetch(DICT+encodeURIComponent(word));if(!r.ok)throw 0;const data=await r.json(),e=data[0];let phonetic=e.phonetic||'',audio='';for(const p of(e.phonetics||[])){if(!phonetic&&p.text)phonetic=p.text;if(!audio&&p.audio)audio=p.audio.startsWith('//')?'https:'+p.audio:p.audio}let meaning=(e.meanings||[]).find(m=>!pos||m.partOfSpeech===pos)||(e.meanings||[])[0];let d=(meaning&&meaning.definitions&&meaning.definitions[0])||{};let d2=(meaning&&meaning.definitions&&meaning.definitions[1])||{};cache[word]={word,phonetic,audio,pos:meaning?.partOfSpeech||pos,definition:d.definition||'Definition unavailable.',example:d.example||`They used ${word} naturally in the conversation.`,example2:d2.example||d.example||`The context made the meaning of ${word} clear.`};save();return cache[word]}catch(e){cache[word]=fallbackDetail(word,pos);save();return cache[word]}}
function speak(word,event){if(event)event.stopPropagation();const d=cache[word];if(d?.audio){const a=new Audio(d.audio);a.play().catch(()=>speech(word));}else speech(word)}function speech(word){if(!('speechSynthesis'in window)){alert('Audio is not supported in this browser.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}
function renderHome(){currentGroup=null;let h='<h1>Your groups</h1><p class="muted">Choose a group or create a new one.</p><div class="groups">';groups.forEach(g=>{const a=g.words.filter(x=>x.status!=='mastered').length,m=g.words.length-a;h+=`<div class="card group" data-id="${esc(g.id)}"><h2>${esc(g.name)}</h2><p class="muted">${g.words.length} words</p><div class="badges"><span class="badge active">${a} Active</span><span class="badge master">${m} Mastered</span></div></div>`});h+='<div class="card create" id="newGroup"><div class="plus">＋</div><h2>Create New Group</h2></div></div>';if(!groups.length)h='<div class="card create" id="newGroup" style="max-width:520px;margin:70px auto"><div class="plus">＋</div><h1>Create New Group</h1><p class="muted">Choose words for your first group.</p></div>';main.innerHTML=h;document.getElementById('newGroup').onclick=renderCreate;document.querySelectorAll('.group').forEach(el=>el.onclick=()=>renderGroup(el.dataset.id))}
async function renderCreate(){main.innerHTML='<div class="card"><h2>Loading B2–C1 vocabulary…</h2><p class="muted">One moment.</p></div>';try{await loadVocabulary()}catch(e){main.innerHTML='<div class="card"><h2>Could not load the vocabulary list.</h2><button class="ghost" id="backHome">Back</button></div>';document.getElementById('backHome').onclick=renderHome;return}const used=usedWords(),available=vocabulary.filter(x=>!used.has(x.word));let selected=new Set(),page=0,pageSize=25;main.innerHTML=`<div class="row between"><div><h1>Create New Group</h1><p class="muted">${available.length.toLocaleString()} unused B2–C1 words available</p></div><button class="ghost" id="homeBtn">← Home</button></div><div class="card"><label>Group name</label><input id="groupName" placeholder="Example: September Week 1"><div class="toolbar"><input id="search" placeholder="Search any word…"><select id="level"><option value="all">B2 + C1</option><option value="B2">B2</option><option value="C1">C1</option></select></div><div id="selectionCount" class="small">0 selected</div><div class="library" id="library"></div><div class="pager"><button class="ghost" id="prevPage">← Previous</button><span id="pageInfo" class="small"></span><button class="ghost" id="nextPage">Next →</button></div><div class="row between"><span class="small">Words already used in another group are hidden automatically.</span><button class="primary" id="saveGroup">Create Group</button></div></div>`;document.getElementById('homeBtn').onclick=renderHome;
function filtered(){const q=norm(document.getElementById('search').value),lev=document.getElementById('level').value;return available.filter(x=>(!q||norm(x.word).includes(q))&&(lev==='all'||x.level===lev))}
async function draw(){const arr=filtered(),pages=Math.max(1,Math.ceil(arr.length/pageSize));if(page>=pages)page=pages-1;if(page<0)page=0;const slice=arr.slice(page*pageSize,(page+1)*pageSize);document.getElementById('library').innerHTML=slice.map(x=>`<label class="librow"><input class="check" type="checkbox" data-word="${esc(x.word)}" ${selected.has(x.word)?'checked':''}><div><b>${esc(x.word)}</b> <span class="ipa" id="ipa-${CSS.escape(x.word)}">loading…</span><div id="def-${CSS.escape(x.word)}" class="small">Loading definition…</div><div id="ex-${CSS.escape(x.word)}" class="example"></div></div><span class="level">${x.level}</span></label>`).join('')||'<p class="muted">No unused matching words.</p>';document.getElementById('pageInfo').textContent=`Page ${page+1} of ${pages} · ${arr.length} words`;document.querySelectorAll('.check').forEach(ch=>ch.onchange=()=>{ch.checked?selected.add(ch.dataset.word):selected.delete(ch.dataset.word);document.getElementById('selectionCount').textContent=selected.size+' selected'});for(const x of slice){details(x.word,x.pos).then(d=>{const ip=document.getElementById('ipa-'+CSS.escape(x.word)),df=document.getElementById('def-'+CSS.escape(x.word)),ex=document.getElementById('ex-'+CSS.escape(x.word));if(ip)ip.textContent=d.phonetic||'';if(df)df.textContent=d.definition;if(ex)ex.textContent='Example: '+d.example})}}
document.getElementById('search').oninput=()=>{page=0;draw()};document.getElementById('level').onchange=()=>{page=0;draw()};document.getElementById('prevPage').onclick=()=>{page--;draw()};document.getElementById('nextPage').onclick=()=>{page++;draw()};draw();document.getElementById('saveGroup').onclick=async()=>{const name=document.getElementById('groupName').value.trim();if(!name||!selected.size){alert('Please name the group and choose at least one word.');return}const btn=document.getElementById('saveGroup');btn.disabled=true;btn.textContent='Creating…';await Promise.all([...selected].map(w=>details(w,vocabulary.find(v=>v.word===w)?.pos||'')));const id='g'+Date.now();groups.push({id,name,words:[...selected].map(w=>({word:w,status:'active',score:0}))});save();currentTab='active';renderGroup(id)}}
async function renderGroup(id){currentGroup=id;const g=G();if(!g){renderHome();return}await Promise.all(g.words.map(x=>details(x.word)));const active=g.words.filter(x=>x.status!=='mastered'),mastered=g.words.filter(x=>x.status==='mastered'),list=currentTab==='mastered'?mastered:active;main.innerHTML=`<div class="row between"><div><h1>${esc(g.name)}</h1><div class="badges"><span class="badge active">${active.length} Active</span><span class="badge master">${mastered.length} Mastered</span></div></div><button class="ghost" id="homeBtn">← Groups</button></div><div class="card row"><button class="primary" id="learnBtn">Learn words</button><button class="primary" id="testBtn">Test my knowledge</button></div><div class="tabs"><button id="activeTab" class="${currentTab==='active'?'on':''}">Active</button><button id="masterTab" class="${currentTab==='mastered'?'on':''}">Mastered</button></div><div class="card">${list.length?list.map(item=>{const d=cache[item.word];return `<div class="wordrow"><div><b>${esc(item.word)}</b> <span class="ipa">${esc(d?.phonetic||'')}</span> <button class="ghost speakBtn" data-word="${esc(item.word)}">🔊</button><div class="small">${esc(d?.definition||'')}</div></div><div class="row"><span class="score">${item.score||0}/7</span><button class="ghost moveBtn" data-word="${esc(item.word)}">${currentTab==='active'?'Move to Mastered':'Move to Active'}</button></div></div>`}).join(''):'<p class="muted">No words here.</p>'}</div>`;document.getElementById('homeBtn').onclick=renderHome;document.getElementById('learnBtn').onclick=startLearn;document.getElementById('testBtn').onclick=startTest;document.getElementById('activeTab').onclick=()=>{currentTab='active';renderGroup(id)};document.getElementById('masterTab').onclick=()=>{currentTab='mastered';renderGroup(id)};document.querySelectorAll('.speakBtn').forEach(b=>b.onclick=e=>speak(b.dataset.word,e));document.querySelectorAll('.moveBtn').forEach(b=>b.onclick=()=>{const x=g.words.find(z=>z.word===b.dataset.word);x.status=x.status==='mastered'?'active':'mastered';x.score=x.status==='mastered'?7:0;save();renderGroup(id)})}
function startLearn(){learnIndex=0;learnFlipped=false;renderLearn()}function renderLearn(){const g=G(),arr=g.words.filter(x=>x.status!=='mastered');if(!arr.length){alert('No Active words to learn.');renderGroup(g.id);return}if(learnIndex>=arr.length)learnIndex=0;const item=arr[learnIndex],d=cache[item.word];const face=!learnFlipped?`<div><div><span class="flashWord">${esc(item.word)}</span><button class="ghost speakBtn" id="learnSpeak">🔊</button></div><div class="ipa">${esc(d?.phonetic||'')}</div><p class="muted">Tap the card to flip</p></div>`:`<div><div class="meaning">${esc(d?.definition||'')}</div><div class="example" style="font-size:17px;margin-top:18px">${esc(d?.example||'')}</div><p class="muted">Tap to see the word again</p></div>`;main.innerHTML=`<div class="learnWrap"><div class="row between"><h2>Learn words</h2><button class="ghost" id="back">← Group</button></div><div class="card flash" id="flash">${face}</div><div class="counter">${learnIndex+1} of ${arr.length}</div><div class="row center"><button class="ghost" id="prev">← Previous</button><button class="primary" id="next">Next →</button></div></div>`;document.getElementById('back').onclick=()=>renderGroup(g.id);document.getElementById('flash').onclick=()=>{learnFlipped=!learnFlipped;renderLearn()};const sp=document.getElementById('learnSpeak');if(sp)sp.onclick=e=>speak(item.word,e);document.getElementById('prev').onclick=()=>{learnIndex=(learnIndex-1+arr.length)%arr.length;learnFlipped=false;renderLearn()};document.getElementById('next').onclick=()=>{learnIndex=(learnIndex+1)%arr.length;learnFlipped=false;renderLearn()}}
async function startTest(){const g=G(),arr=g.words.filter(x=>x.status!=='mastered');if(!arr.length){alert('No Active words to test.');return}main.innerHTML='<div class="card"><h2>Preparing test…</h2></div>';await Promise.all(arr.map(x=>details(x.word)));session=[];scores={};arr.forEach(x=>{scores[x.word]=0;['def1','gap1','listen','def2','gap2','speak','sentence'].forEach(t=>session.push({word:x.word,type:t}))});shuffle(session);qIndex=0;renderQuestion()}
function typedBox(){return `<input id="answer" autocomplete="off" placeholder="Type your answer"><p class="small">Press ENTER to check</p><div class="row center"><button class="secondary" id="dont">I don't know</button></div>`}
function renderQuestion(){if(qIndex>=session.length){finishTest();return}locked=false;const g=G(),q=session[qIndex],d=cache[q.word];let mode='',prompt='',box='';if(q.type.startsWith('def')){mode='Description → type the word';prompt=esc(d.definition);box=typedBox()}if(q.type.startsWith('gap')){mode='Sentence → type the missing word';const ex=q.type==='gap1'?d.example:d.example2;const re=new RegExp('\\b'+q.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','ig');prompt=esc((ex||'').replace(re,'__________'));box=typedBox()}if(q.type==='listen'){mode='Listen → type the word';prompt='<button class="primary" id="play">🔊 Play word</button>';box=typedBox()}if(q.type==='speak'){mode='Description → pronounce the word';prompt=esc(d.definition);box=`<div class="row center"><button class="primary" id="speakTest">🎤 Speak</button><button class="secondary" id="dont">I don't know</button></div><p class="small">Understandable foreign accents are accepted when the browser recognizes the intended word.</p>`}if(q.type==='sentence'){mode='Use the word in a sentence';prompt='<b>'+esc(q.word)+'</b>';box=`<textarea id="sentence" placeholder="Write a natural sentence using this word."></textarea><div class="row center" style="margin-top:10px"><button class="primary" id="checkSentence">Check</button><button class="secondary" id="dont">I don't know</button></div>`}main.innerHTML=`<div class="testWrap"><div class="row between"><div><div class="mode">${mode}</div><div class="small">${qIndex+1} of ${session.length}</div></div><button class="ghost" id="end">End test</button></div><div class="progress"><div style="width:${qIndex/session.length*100}%"></div></div><div class="card"><div class="prompt">${prompt}</div>${box}<div id="feedback"></div><div class="row center" style="margin-top:14px"><button class="primary" id="nextQ" style="display:none">Next</button></div></div></div>`;document.getElementById('end').onclick=()=>renderGroup(g.id);document.getElementById('nextQ').onclick=()=>{qIndex++;renderQuestion()};const dont=document.getElementById('dont');if(dont)dont.onclick=()=>mark(false);const ans=document.getElementById('answer');if(ans){ans.focus();ans.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();mark(norm(ans.value)===norm(q.word))}}const play=document.getElementById('play');if(play)play.onclick=e=>speak(q.word,e);const st=document.getElementById('speakTest');if(st)st.onclick=()=>recognize(q.word);const cs=document.getElementById('checkSentence');if(cs)cs.onclick=()=>{const s=document.getElementById('sentence').value.trim();const re=new RegExp('\\b'+q.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');mark(re.test(s)&&s.split(/\s+/).filter(Boolean).length>=5)}}
function mark(ok){if(locked)return;locked=true;const q=session[qIndex],d=cache[q.word];if(ok)scores[q.word]++;document.getElementById('feedback').innerHTML=`<div class="feedback ${ok?'ok':'bad'}">${ok?'✓ Correct':'✕ Answer: '+esc(q.word)}<div class="small" style="margin-top:5px">${esc(d.definition)}</div></div>`;document.getElementById('nextQ').style.display='inline-block'}
function recognize(target){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Speech recognition works best in Chrome or Edge.');return}const r=new SR();r.lang='en-US';r.maxAlternatives=5;r.interimResults=false;r.onresult=e=>{let ok=false;for(let i=0;i<e.results[0].length;i++){const t=norm(e.results[0][i].transcript);if(t===norm(target)||t.split(' ').includes(norm(target)))ok=true}mark(ok)};r.onerror=()=>alert('I could not understand that. Please try again.');r.start()}
function finishTest(){const g=G();g.words.forEach(x=>{if(scores[x.word]!==undefined){x.score=scores[x.word];x.status=x.score===7?'mastered':'active'}});save();const mastered=Object.values(scores).filter(v=>v===7).length;main.innerHTML=`<div class="testWrap"><div class="card" style="text-align:center"><h1>Test complete</h1><p><b>${mastered}</b> words reached 7/7 and moved to Mastered.</p><p class="muted">Anything below 7/7 remains Active.</p><button class="primary" id="backGroup">Back to group</button></div></div>`;document.getElementById('backGroup').onclick=()=>renderGroup(g.id)}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
document.getElementById('logo').onclick=renderHome;document.getElementById('fallbackCreate').onclick=renderCreate;if(groups.length)renderHome();
</script></body></html>
